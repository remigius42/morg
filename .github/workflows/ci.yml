name: "CI"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags: the web build stamps the page with
          # `git describe --tags`, which degrades to a bare commit SHA
          # on the default shallow checkout, which has no tags
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install NPM packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:unit:ci
      - name: Upload coverage to Codacy
        # skipped for forked PRs, which cannot access the token secret
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        # third-party action pinned to a commit SHA (immutable, unlike tags)
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info
      - name: Build
        run: npm run build
      - name: Smoke-test CLI
        run: |
          echo "# Hello" | node dist/cli.js --from markdown | grep -q '^\* Hello'
          printf '* Hello\n' | node dist/cli.js --from org | grep -q '^# Hello'
      - name: Build web UI
        run: npm run build:web
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install production dependencies
        # `--ignore-scripts` because `scripts.prepare` runs husky, which is a
        # dev dependency omitted here for the scan
        run: npm install --omit=dev --ignore-scripts
      - name: Run security scan with Trivy
        # third-party action pinned to a commit SHA (immutable, unlike tags)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          format: table
          exit-code: 1
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
