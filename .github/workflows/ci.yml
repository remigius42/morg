name: "CI"
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install NPM packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:unit:ci
      - name: Build
        run: npm run build
      - name: Smoke-test CLI
        run: |
          echo "# Hello" | node dist/cli.js --from markdown | grep -q '^\* Hello'
          printf '* Hello\n' | node dist/cli.js --from org | grep -q '^# Hello'
      - name: Build web UI
        run: npm run build:web
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
