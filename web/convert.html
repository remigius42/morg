<!doctype html>
<html lang="en">
  <head>
    <!-- chrome:head -->
    <meta
      name="description"
      content="Convert between Markdown and Org-mode in the browser: paste text, get an instant round-trip-safe conversion."
    />
    <title>morg converter</title>
    <link rel="canonical" href="https://morg.binarypoetry.ch/convert.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="morg" />
    <meta property="og:title" content="morg converter" />
    <meta
      property="og:description"
      content="Convert between Markdown and Org-mode in the browser: paste text, get an instant round-trip-safe conversion."
    />
    <meta
      property="og:url"
      content="https://morg.binarypoetry.ch/convert.html"
    />
    <meta
      property="og:image"
      content="https://morg.binarypoetry.ch/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- chrome:header -->
    <!-- labelled because the embedded converter is a document of its own
         and brings a second `main` into the accessibility tree -->
    <main class="container-fluid" aria-label="Converter">
      <!-- the Clipboard API needs an explicit grant in an iframe; without
           it the Copy button falls back to a selection copy -->
      <iframe
        src="./embed.html"
        class="site-frame"
        title="morg converter"
        allow="clipboard-write"
      ></iframe>
    </main>
    <!-- chrome:footer -->
    <script type="module" src="/src/site.ts"></script>
  </body>
</html>
