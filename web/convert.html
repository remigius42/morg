<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Convert between Markdown and Org-mode in the browser — paste text, get an instant round-trip-safe conversion."
    />
    <title>morg converter</title>
    <link rel="canonical" href="https://morg.binarypoetry.ch/convert.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="morg" />
    <meta property="og:title" content="morg converter" />
    <meta
      property="og:description"
      content="Convert between Markdown and Org-mode in the browser — paste text, get an instant round-trip-safe conversion."
    />
    <meta
      property="og:url"
      content="https://morg.binarypoetry.ch/convert.html"
    />
    <meta
      property="og:image"
      content="https://morg.binarypoetry.ch/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/theme.css" />
    <script>
      // applied before first paint to avoid a theme flash; mirrors
      // resolveTheme() in src/theme.ts
      try {
        const theme =
          new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("morg-theme")
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme
        }
      } catch {}
    </script>
  </head>
  <body>
    <header class="container">
      <nav>
        <ul>
          <li>
            <strong><a href="./">morg</a></strong>
          </li>
        </ul>
        <ul>
          <li><a href="https://github.com/remigius42/morg">GitHub</a></li>
          <li>
            <div class="theme-switch" role="group" aria-label="Color scheme">
              <button
                id="themeLight"
                class="theme-toggle"
                aria-label="Light theme"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="5" />
                  <line x1="12" y1="1" x2="12" y2="3" />
                  <line x1="12" y1="21" x2="12" y2="23" />
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                  <line x1="1" y1="12" x2="3" y2="12" />
                  <line x1="21" y1="12" x2="23" y2="12" />
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
              </button>
              <button
                id="themeDark"
                class="theme-toggle"
                aria-label="Dark theme"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
              </button>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <main class="container-fluid">
      <iframe
        src="./embed.html"
        class="site-frame"
        title="morg converter"
      ></iframe>
    </main>
    <footer class="container">
      <small>
        Copyright 2026
        <a href="https://www.binarypoetry.ch">Andreas Remigius Schmidt</a> ·
        <a href="https://github.com/remigius42/morg/blob/main/LICENSE"
          >GPL-3.0-or-later</a
        >
        · <a href="https://www.buymeacoffee.com/remigius">Buy me a coffee</a> ·
        <span id="version"></span>
      </small>
    </footer>
    <script type="module" src="/src/site.ts"></script>
  </body>
</html>
