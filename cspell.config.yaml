version: "0.2"
language: en
dictionaryDefinitions:
  - name: project-words
    path: ./cspell.project-words.txt
    addWords: true
dictionaries:
  - project-words
ignorePaths:
  - .git
  - TODO.md # private, gitignored working notes
  - ".husky/_"
  - node_modules
  - dist
  - coverage
  - tests/e2e/reports # playwright's own html/trace output
  - .claude/worktrees # other checkouts of this repo
  - package-lock.json
  - web/public/licenses-*.json # third-party license texts, written by the web build
  - LICENSE
  - cspell.project-words.txt
